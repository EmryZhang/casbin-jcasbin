name: Publish Maven

on:
  workflow_call:
    inputs:
      maven_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      maven_version:
        description: Maven release version to publish, for example 1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-maven:
    name: Publish Maven
    if: ${{ github.repository == 'apache/casbin-jcasbin' }}
    runs-on: ubuntu-latest
    concurrency:
      group: maven-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the committed release version
        env:
          MAVEN_VERSION: ${{ inputs.maven_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          requested = os.environ['MAVEN_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', requested):
              raise SystemExit('Expected a final Maven release version X.Y.Z')
          if os.environ['GITHUB_REF'] != f'refs/tags/v{requested}':
              raise SystemExit('Publish only from the matching final release tag after the vote')
          version = ET.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version')
          if version != requested:
              raise SystemExit(f'POM version mismatch: expected {requested}, got {version}')
          PY

      - name: Verify promoted ASF release before loading signing credentials
        env:
          MAVEN_VERSION: ${{ inputs.maven_version }}
        run: python3 .github/scripts/verify_release.py "${MAVEN_VERSION}" --output verified-release

      - name: Set up Java 8 and Javadoc 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            8
          server-id: ossrh
          server-username: OSSRH_JIRA_USERNAME
          server-password: OSSRH_JIRA_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish Maven
        run: |
          mvn -B -ntp clean package -DskipTests -Dgpg.skip=true
          python3 .github/scripts/verify_javadoc.py target/jcasbin-*-javadoc.jar
          mvn -B -ntp deploy -DskipTests
        env:
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          OSSRH_JIRA_USERNAME: ${{ secrets.OSSRH_JIRA_USERNAME }}
          OSSRH_JIRA_PASSWORD: ${{ secrets.OSSRH_JIRA_PASSWORD }}
